<div class="admin-wrapper">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <a routerLink="/" class="text-white text-decoration-none">
        <strong>LOI</strong> <span class="text-accent">CODE</span> <small class="text-white-50">ADMIN</small>
      </a>
    </div>

    @if (isDemo) {
      <div class="p-2 mx-3 mb-3 rounded-3 bg-warning text-dark small fw-semibold text-center">
        <i class="bi bi-info-circle-fill me-1"></i> Modo Demo Activo
      </div>
    }

    <nav class="sidebar-nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a routerLink="/admin/productos" routerLinkActive="active" class="nav-item">
        <i class="bi bi-box-seam"></i> Productos & Servicios
      </a>
      <a routerLink="/admin/recursos" routerLinkActive="active" class="nav-item">
        <i class="bi bi-gift"></i> Recursos Gratuitos
      </a>
      <a routerLink="/admin/blog" routerLinkActive="active" class="nav-item">
        <i class="bi bi-journal-text"></i> Blog (Posts)
      </a>
      <a routerLink="/admin/solicitudes" routerLinkActive="active" class="nav-item">
        <i class="bi bi-inbox"></i> Solicitudes (Cotizaciones)
      </a>
      <a routerLink="/admin/pedidos" routerLinkActive="active" class="nav-item">
        <i class="bi bi-credit-card"></i> Pedidos (Mercado Pago)
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info text-truncate mb-2">
        <small class="text-white-50 d-block">Sesión iniciada:</small>
        <strong>{{ auth.email() }}</strong>
      </div>
      <div class="d-flex gap-2">
        <a routerLink="/" class="btn btn-sm btn-outline-light flex-grow-1" target="_blank" title="Ver sitio web">
          <i class="bi bi-globe"></i> Ver Sitio
        </a>
        <button class="btn btn-sm btn-danger" (click)="onLogout()" title="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-content">
    <div class="container-fluid p-4 p-md-5">
      <router-outlet />
    </div>
  </main>
</div>
