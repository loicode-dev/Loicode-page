<div class="mb-4">
  <a routerLink="/admin/blog" class="text-muted-brand small text-decoration-none">← Volver al blog</a>
  <h1 class="h3 font-outfit text-navy mt-1">{{ id() ? 'Editar Artículo' : 'Nuevo Artículo de Blog' }}</h1>
</div>

@if (errorMsg()) {
  <div class="alert alert-danger mb-4">{{ errorMsg() }}</div>
}

<div class="card card-soft p-4 p-md-5">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Título del Artículo *</label>
        <input type="text" class="form-control" formControlName="title" (input)="onTitleChange()" placeholder="Ej. 7 Ventajas de las invitaciones digitales" />
      </div>

      <div class="col-md-6">
        <label class="form-label">Slug *</label>
        <input type="text" class="form-control" formControlName="slug" placeholder="ventajas-invitaciones-digitales" />
      </div>

      <div class="col-md-6">
        <label class="form-label">Autor</label>
        <input type="text" class="form-control" formControlName="author" placeholder="LOI CODE" />
      </div>

      <div class="col-md-6">
        <label class="form-label">Etiquetas (separadas por coma)</label>
        <input type="text" class="form-control" formControlName="tagsText" placeholder="web, invitaciones, consejos, diseño" />
      </div>

      <div class="col-12">
        <label class="form-label">Imagen de Portada</label>
        <div class="input-group mb-2">
          <input type="text" class="form-control" formControlName="cover_url" placeholder="https://... o ruta de imagen" />
          <input type="file" #fileInput (change)="onUploadCover($event)" class="d-none" accept="image/*" />
          <button type="button" class="btn btn-outline-secondary" (click)="fileInput.click()" [disabled]="isUploading()">
            @if (isUploading()) {
              <span class="spinner-border spinner-border-sm"></span> Subiendo...
            } @else {
              <i class="bi bi-cloud-arrow-up me-1"></i> Subir a Supabase Media
            }
          </button>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">Extracto o Resumen *</label>
        <textarea rows="2" class="form-control" formControlName="excerpt" placeholder="Breve párrafo que aparecerá en la lista de artículos..."></textarea>
      </div>

      <div class="col-12">
        <label class="form-label">Contenido Completo (Markdown) *</label>
        <textarea rows="10" class="form-control font-monospace" formControlName="content" placeholder="Escribe tu artículo en formato Markdown..."></textarea>
      </div>

      <div class="col-12 pt-3 border-top">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="postPubSwitch" formControlName="is_published" />
          <label class="form-check-label fw-semibold" for="postPubSwitch">Publicar inmediatamente</label>
        </div>
      </div>

      <div class="col-12 mt-4 text-end">
        <a routerLink="/admin/blog" class="btn btn-outline-secondary me-2">Cancelar</a>
        <button type="submit" class="btn btn-brand" [disabled]="isSaving()">
          @if (isSaving()) {
            <span class="spinner-border spinner-border-sm me-1"></span> Guardando...
          } @else {
            <i class="bi bi-save me-1"></i> Guardar Post
          }
        </button>
      </div>
    </div>
  </form>
</div>
